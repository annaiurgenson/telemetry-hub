name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure clean build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --preset windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }

      - name: Build all default targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --build --preset windows-msvc-debug --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }

      - name: Verify focused test registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testListing = & ctest --preset windows-msvc-debug --show-only=json-v1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "CTest test discovery failed with exit code $LASTEXITCODE"
          }
          $registeredNames = @((ConvertFrom-Json -InputObject $testListing).tests | ForEach-Object { $_.name })

          $focusedTests = @(
            'WorkerPool.ExecutesTasksInParallelWithMultipleWorkers',
            'WorkerPool.AppliesBackpressureWhenQueueIsFull',
            'WorkerPool.GracefulShutdownDrainsQueuedTasks',
            'WorkerPool.ShutdownWakesAndRejectsBlockedSubmission',
            'WorkerPool.ConcurrentProducersLoseNoAcceptedTasks',
            'CommandIngress.BoundedQueueReportsFullAndShutdownDrainsAcceptedCommands',
            'CommandIngress.ConcurrentShutdownCallsAreIdempotentAndDrainOnce',
            'CommandIngress.ConcurrentProducerStopsAtClosedAdmission',
            'CommandIngress.ConcurrentSubmissionsUseOneProcessorAndDrain',
            'CommandIngress.ShutdownDrainsWhenDispatcherIsBlockedByFullWorkerPool',
            'TcpServer.AcceptsSeveralClientsWithUniqueServerGeneratedIds',
            'TcpServer.ShutdownCompletesWithActiveClientsAndBackpressuredWriter',
            'TcpServer.EnqueueDisconnectReapingAndShutdownCanRace',
            'TcpServer.ConcurrentShutdownRequestsAreSafe',
            'TcpServer.CanRestartAfterShutdownWithoutReusingConnectionIds',
            'ProtocolSession.ConcurrentRegistrationHasOneOwnerAndDisconnectAllowsReconnect',
            'ProtocolSession.SaturationReturnsCorrelatedServerBusyInMixedBatch',
            'ProtocolSession.DelayedResponseForDisconnectedConnectionCannotReachReconnect',
            'ProtocolSession.IngressDrainsAcceptedTelemetryWhileServerRemainsAlive'
          )

          $missingTests = @($focusedTests | Where-Object { $_ -notin $registeredNames })
          if ($missingTests.Count -gt 0) {
            throw "Required focused CTest names are missing or renamed: $($missingTests -join ', ')"
          }

          $focusedPattern = '^(' + (($focusedTests | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          $selectedTests = @($registeredNames | Where-Object { $_ -match $focusedPattern })
          if ($selectedTests.Count -eq 0) {
            throw 'The focused CTest selection is empty'
          }
          Write-Host "Verified $($selectedTests.Count) focused tests, including the worker-pool backpressure shutdown regression."

      - name: Run complete test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ctest --preset windows-msvc-debug --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Complete CTest suite failed with exit code $LASTEXITCODE"
          }

      - name: Repeat focused concurrency and integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $focusedTests = @(
            'WorkerPool.ExecutesTasksInParallelWithMultipleWorkers',
            'WorkerPool.AppliesBackpressureWhenQueueIsFull',
            'WorkerPool.GracefulShutdownDrainsQueuedTasks',
            'WorkerPool.ShutdownWakesAndRejectsBlockedSubmission',
            'WorkerPool.ConcurrentProducersLoseNoAcceptedTasks',
            'CommandIngress.BoundedQueueReportsFullAndShutdownDrainsAcceptedCommands',
            'CommandIngress.ConcurrentShutdownCallsAreIdempotentAndDrainOnce',
            'CommandIngress.ConcurrentProducerStopsAtClosedAdmission',
            'CommandIngress.ConcurrentSubmissionsUseOneProcessorAndDrain',
            'CommandIngress.ShutdownDrainsWhenDispatcherIsBlockedByFullWorkerPool',
            'TcpServer.AcceptsSeveralClientsWithUniqueServerGeneratedIds',
            'TcpServer.ShutdownCompletesWithActiveClientsAndBackpressuredWriter',
            'TcpServer.EnqueueDisconnectReapingAndShutdownCanRace',
            'TcpServer.ConcurrentShutdownRequestsAreSafe',
            'TcpServer.CanRestartAfterShutdownWithoutReusingConnectionIds',
            'ProtocolSession.ConcurrentRegistrationHasOneOwnerAndDisconnectAllowsReconnect',
            'ProtocolSession.SaturationReturnsCorrelatedServerBusyInMixedBatch',
            'ProtocolSession.DelayedResponseForDisconnectedConnectionCannotReachReconnect',
            'ProtocolSession.IngressDrainsAcceptedTelemetryWhileServerRemainsAlive'
          )
          $focusedPattern = '^(' + (($focusedTests | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          & ctest --preset windows-msvc-debug --tests-regex $focusedPattern --repeat until-fail:20 --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Repeated focused CTest selection failed with exit code $LASTEXITCODE"
          }
